nt)}.none-choice{position:relative;z-index:1;border:1px solid var(--ink);background:var(--white);color:var(--ink);min-height:52px;width:100%;margin-bottom:28px;font-weight:750;display:flex;justify-content:center;align-items:center;gap:12px}.audio-play{border:2px solid var(--ink);background:var(--white);width:140px;height:140px;border-radius:50%;display:flex;justify-content:center;align-items:center;flex-direction:column;color:var(--ink);gap:5px}.audio-play span{font-size:62px;line-height:1}.audio-play small{font-size:12px;font-family:system-ui}.mine-countdown{margin:17px 0 0;background:var(--rule);height:7px;border-radius:10px;overflow:hidden}.mine-bar{height:100%;width:100%;background:var(--red)}.game-hint{text-align:center;font:11px ui-monospace,monospace;color:var(--muted);margin:24px 0}.feedback-scrim{position:fixed;inset:0;background:rgba(9,13,18,.65);display:grid;place-items:center;padding:20px;z-index:25;overflow:auto}.feedback-card{background:var(--paper);width:min(460px,100%);padding:29px 33px 28px;box-shadow:0 30px 100px rgba(0,0,0,.24);border:1px solid var(--rule);text-align:center;position:relative;animation:pop .25s ease-out}.stamp{width:128px;height:128px;border:5px double var(--green);border-radius:50%;display:flex;justify-content:center;align-items:center;flex-direction:column;margin:0 auto 23px;color:var(--green);font-size:51px;transform:rotate(-7deg);font-weight:950;line-height:1}.stamp span{font-size:13px;letter-spacing:1px;margin-top:2px}.feedback-bad .stamp{color:var(--red);border-color:var(--red)}.feedback-card .eyebrow{margin-bottom:20px}.verdict-word{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(27px,5vw,37px);font-weight:700;margin:0 0 24px;overflow-wrap:anywhere}.verdict-word mark{background:linear-gradient(transparent 54%,var(--highlight) 54%);color:var(--ink);padding:0 3px}.wrong-spelling{display:block;color:var(--red);font-size:19px;margin-top:10px;text-decoration:line-through}.rule-box{background:var(--white);border:1px soli .result-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:28px;padding:65px 0 70px}.result-file{background:var(--paper);border:1px solid var(--rule);position:relative;padding:37px 42px}.result-label{font:11px ui-monospace,monospace;letter-spacing:1.7px;color:var(--muted);border-bottom:1px dashed var(--rule);padding-bottom:20px}.result-seal{position:absolute;right:45px;top:80px;width:88px;height:88px;border:5px double var(--green);color:var(--green);border-radius:50%;display:grid;place-items:center;font-size:53px;transform:rotate(-13deg)}.result-file>.eyebrow{margin-top:51px}.result-file h1{font-size:clamp(39px,5.5vw,63px);letter-spacing:-.08em;margin:10px 0 15px}.result-file h1 span{color:var(--red)}.big-score{font-family:Georgia,serif;font-size:clamp(60px,10vw,103px);line-height:1.2;font-weight:700;letter-spacing:-.05em}.big-score small{font:12px ui-monospace,monospace;color:var(--muted);letter-spacing:1px}.result-triplet{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:22px 0}.result-triplet div{display:flex;flex-direction:column;gap:6px;padding-inline:12px;border-inline-start:1px solid var(--rule)}.result-triplet div:first-child{padding-inline-start:0;border-inline-start:0}.result-triplet strong{font:700 33px Georgia,serif}.result-triplet span{font-size:12px;color:var(--muted)}.result-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:26px}.result-grid span{display:grid;place-items:center;width:27px;height:27px;font-size:29px}.green-square{color:var(--green)}.red-square{color:var(--red)}.result-hint{font-size:12px;color:var(--muted);margin:10px 0 23px}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result-actions .primary-cta{grid-column:span 2}.outline-cta,.plain-cta{padding:14px 13px;min-height:48px;background:transparent;border:1px solid var(--ink);color:var(--ink);font-weight:750;font-size:13px}.plain-cta{grid-colum ted);font:11px ui-monospace,monospace}.import-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.import-controls .outline-cta{font-size:12px}.import-controls span,.micro-note{color:var(--muted);font-size:11px}.modal-panel textarea{display:block;min-height:172px;font:12px/1.6 ui-monospace,monospace;resize:vertical}.micro-note{line-height:1.65;margin-top:15px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--paper);padding:13px 25px;font-size:13px;box-shadow:var(--shadow);border-radius:5px;max-width:85vw;text-align:center}.toast[hidden]{display:none}

function pickWeighted(pool,rng,rank,lang,universal=false){let arr=[...pool],result=[];while(arr.length){let weights=arr.map(q=>(universal?1:difficultyWeight(q.d,rank))*(universal?1:1/(1+.8*(stats(lang).counts?.[q.id]||0))));let sum=weights.reduce((a,b)=>a+b,0),v=rng()*sum;let pos=weights.findIndex(w=>(v-=w)<=0);if(pos<0)pos=0;result.push(arr.splice(pos,1)[0]);}return result;}

  let shown=`<div class="word-content ${p.pat==='gap'?'word-gap':''} ${isRtl()?'rtl':''}" ${p.pat==='listen'?'aria-label="Listen to the spoken word"':''}>${ESC(p.heading)}</div>`;
  if(p.pat==='listen')shown=`<button class="audio-play" data-action="speak" aria-label="${ESC(t('listenBtn'))}"><span>♫</span><small>${ESC(t('listenBtn'))}</small></button>`;
  choices=`<div class="case-word">${shown}</div><div class="choice-list ${p.pat==='mine'||p.pat==='speed'?'binary':''}">${p.opts.map((o,i)=>`<button class="answer-choice ${o==='tap'||o==='wrong'?'red-choice':''}" data-choice="${i}"><span class="choice-index">${i+1}</span><span>${ESC(o==='tap'?t('tap'):o==='pass'?t('pass'):o==='wrong'?t('wrong'):o==='right'?t('right'):o)}</span><span class="choice-arrow">↗</span></button>`).join('')}</div>`;
 }
 const title=p.pat==='speed'?t('speed'):p.pat==='mine'?t('word'):p.pat==='pair'?t('word'):p.pat==='gap'?t('word'):p.pat==='fix'?t('word'):p.pat==='find'?t('sentence'):p.pat==='cloze'?t('sentence'):p.pat==='scene'?t('scene'):t('dictation');
 EL.app.innerHTML=`<div class="shell playing">${makeHeader(true)}<main class="game-layout"><div class="play-top"><button class="back-link" data-action="home">← ${ESC(t('exit'))}</button><span>INVESTIGATION / ${ESC(title).toUpperCase()}</span><span>${ESC(t('score'))} <strong>${g.score}</strong></span></div><div class="game-meta"><div><p class="eyebrow">CASE NO. ${String(currentCount).padStart(3,'0')} / ${totalCount}</p><h1>${ESC(p.label)}</h1></div><div class="hearts" aria-label="${ESC(t('hearts'))}">${hearts}</div></div><div class="progress-track"><div class="progress-fill" style="width:${g.mode==='speed'?0:Math.max(0,(g.index/g.deck.length)*100)}%"></div></div><div class="paper-wrap"><div class="paper-pin">●</div><div class="paper-card"><div class="paper-label">EVIDENCE ${String(currentCount).padStart(3,'0')} <span>✳</span></div>${choices}<div class="paper-foot"><span>CONFIDENTIAL · ${ESC(getMeta(g.lang).code)}</span><span>◈ BBB</span></div></div></div>${p.pat==='mine'?`<div class="mine-countdown"><div class="mine-bar" id="mine-bar"></div></div>`:''}<p class="game-hint">${ESC(t('kbd'))}</p></main></div><div class="overlay-slot" id="overlay-slot" aria-live="polite"></div>`;
 if(p.pat==='listen')speak();if(p.pat==='mine')scheduleMine();if(g.mode==='speed')updateSpeedUI();
 if(overlay)renderFeedback();
}
function scheduleMine(){clearInterval(mineTimer);if(!game||overlay)return;let sec={1:3.6,2:2.8,3:2.1}[game.rank]||2.8;game.mineDeadline=Date.now()+sec*1000;const duration=sec*1000;
 mineTimer=setInterval(()=>{if(!game||game.locked){clearInterval(mineTimer);return;}let rem=Math.max(0,game.mineDeadline-Date.now());let bar=$('#mine-bar');if(bar)bar.style.width=`${(rem/duration)*100}%`;if(rem<=0){clearInterval(mineTimer);answer('timeout');}},38);
}
function tick(){if(!game||game.mode!=='speed')return;if(Date.now()>=game.speedEnd){endGame();return;}updateSpeedUI();}
function updateSpeedUI(){let el=$('#speed-count');if(el&&game?.speedEnd)el.textContent=`${Math.max(0,(game.speedEnd-Date.now())/1000).toFixed(1)}s`;}
function speak(){if(!game?.current||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let utterance=new SpeechSynthesisUtterance(game.current.q.c);utterance.lang=getMeta(game.lang).locale;utterance.rate=.76;const match=voiceList.find(v=>v.lang.toLowerCase().startsWith(utterance.lang.split('-')[0].toLowerCase()));if(match)utterance.voice=match;speechSynthesis.speak(utterance);}catch{toast(t('blocked'));}}
function recordAnswer(q,correct){let lang=game.lang,st=stats(lang);st.counts=st.counts||{};if(correct)st.counts[q.id]=(st.counts[q.id]||0)+1;
 if(!SR[lang])SR[lang]={};let existing=SR[lang][q.id];if(!correct)SR[lang][q.id]={stage:0,due:pickDate()};else if(existing){let next=existing.stage+1;if(next>=4)delete SR[lang][q.id];else SR[lang][q.id]={stage:next,due:dateAdd([0,2,4,8][next])};}
 save(KEY.st,ST);save(KEY.sr,SR);
}
function answer(chosen){
 if(!game||view!=='play'||game.locked||overlay)return;
 const g=game,p=g.activePattern;if(!p)return;
 let correct=false,missed=false;
 if(chosen==='timeout'){if(p.pat!=='mine')return;chosen=String(p.opts.indexOf('pass'));missed=p.isTypo;}
 if(p.kind==='tokens'){let index=Number(String(chosen).split(':')[1]);correct=index===p.correct;}
 else {const index=Number(chosen);const choice=Number.isInteger(index)&&index>=0&&index<p.opts.length?p.opts[index]:null;correct=choice===p.correct;}
 g.locked=true;clearInterval(mineTimer);if(!correct){g.wrong++;g.lives--;g.streak=0;g.missed.push(g.current.q);}else{g.correct++;g.streak++;g.score+=100+Math.min(80,g.streak*10);}
 recordAnswer(g.current.q,correct);
 g.history.push({id:g.current.q.id,correct,pat:g.current.pat});
 overlay={correct,missed,q:g.current.q};renderFeedback();
 if(g.mode==='speed'){autoNext=setTimeout(nextQuestion,correct?300:650);}
 else if(correct){autoNext=setTimeout(nextQuestion,1500);}
}
function renderFeedback(){const target=$('#overlay-slot');if(!target||!overlay||!game)return;let {correct,missed,q}=overlay;
 target.innerHTML=`<div class="feedback-scrim"><section class="feedback-card ${correct?'feedback-good':'feedback-bad'}" role="status" aria-label="${ESC(correct?t('correct'):t('incorrect'))}"><div class="stamp">${correct?'✓':'✕'}<span>${ESC(missed?t('miss'):correct?t('correct'):t('incorrect'))}</span></div><p class="eyebrow">CASE FILE / ${ESC(q.id)}</p><div class="verdict-word"><mark>${ESC(q.c)}</mark>${!correct?` <span class="wrong-spelling">✕ ${ESC(q.w)}</span>`:''}</div><div class="rule-box"><span>✳ ${ESC(t('rules'))}</span><p>${ESC(q.r||'—')}</p></div><div class="feedback-actions">${!correct||game.mode==='speed'?`<button class="primary-cta" data-action="next">${ESC(t('next'))} <span>↗</span></button>`:`<div class="auto-message">▰▰▰ →</div>`}<button class="quiet-link" data-action="report">⚑ ${ESC(t('issue'))}</button></div></section></div>`;
}
function nextQuestion(){clearTimeout(autoNext);if(!game||view!=='play')return;overlay=null;game.locked=false;game.activePattern=null;game.serial++;
 if(game.mode==='speed'){if(Date.now()>=game.speedEnd){endGame();return;}game.current=createSpeedItem();if(!game.current){endGame();return;}}
 else{game.index++;if(game.index>=game.deck.length||game.lives<=0){endGame();return;}game.current=game.deck[game.index];}
 renderPlay();
}
function endGame(){if(!game||view!=='play')return;clearTimers();try{speechSynthesis.cancel();}catch{}
 const st=stats(game.lang);st.best=Math.max(st.best||0,game.score);
 if(game.mode==='speed')st.speedBest=Math.max(st.speedBest||0,game.correct);
 if(game.mode==='daily'&&game.history.length===game.deck.length){st.dailyDates=Array.from(new Set([...(st.dailyDates||[]),pickDate()])).slice(-90);}
 st.sessions=[...(st.sessions||[]),{at:Date.now(),mode:game.mode,correct:game.correct,wrong:game.wrong,score:game.score}].slice(-100);
 save(KEY.st,ST);view='results';overlay=null;render();
}
function renderResults(){const g=game;if(!g){view='home';return renderHome();}const total=g.history.length,percent=total?Math.round(g.correct/total*100):0;const st=stats(g.lang);
 EL.app.innerHTML=`<div class="shell results-page">${makeHeader()}<main class="result-layout"><div class="result-file"><div class="result-label">CLOSED FILE / ${ESC(g.mode.toUpperCase())}</div><div class="result-seal">✓</div><p class="eyebrow">${ESC(t('finish'))}</p><h1>${ESC(t('caseDone'))}<span>.</span></h1><div class="big-score">${g.score}<small> PTS</small></div><div class="result-triplet"><div><strong>${percent}%</strong><span>${ESC(t('accuracy'))}</span></div><div><strong>${g.correct}</strong><span>${ESC(t('rightCount'))}</span></div><div><strong>${g.wrong}</strong><span>${ESC(t('wrongCount'))}</span></div></div><div class="result-grid" aria-label="${ESC(t('shareTip'))}">${g.history.map(x=>`<span title="${ESC(x.id)}" class="${x.correct?'green-square':'red-square'}">${x.correct?'■':'■'}</span>`).join('')}</div><p class="result-hint">${ESC(t('shareTip'))}</p><div class="result-actions"><button class="primary-cta" data-action="replay">${ESC(t('again'))} <span>↗</span></button><button class="outline-cta" data-action="share">${ESC(t('share'))} ↗</button><button class="outline-cta" data-action="class-create">⌗ ${ESC(t('make'))}</button><button class="plain-cta" data-action="home">← ${ESC(t('home'))}</button></div></div><aside class="result-review"><div class="review-head"><p class="eyebrow">POST-CASE REPORT</p><h2>${ESC(t('memo'))}</h2><span>${g.missed.length} FILES</span></div><p class="review-subtitle">${ESC(t('reviewHint'))}</p>${g.missed.length?g.missed.map(q=>`<div class="review-line"><div class="review-correct">${ESC(q.c)}<small>✕ ${ESC(q.w)}</small></div><p>${ESC(q.r)}</p></div>`).join(''):`<div class="review-empty">✳<p>${ESC(t('correct'))}</p></div>`}<div class="mini-record"><span>${ESC(t('best'))}</span><strong>${g.mode==='speed'?st.speedBest+' ✓':st.best+' PTS'}</strong></div></aside></main></div>`;
}
function shareText(){let g=game,meta=getMeta(g.lang),grid=g.history.map(x=>x.correct?'🟩':'🟥').join('');let score=g.mode==='speed'?g.correct+' correct':g.score+' pts';return `🔍 ${t('intro')} / ${meta.name}\n${g.mode==='daily'?pickDate()+' DAILY\n':''}${g.classCode?'CLASS '+g.classCode+'\n':''}${score} · ${g.correct}/${g.history.length}\n${grid}\n${location.protocol==='file:'?'':location.origin+location.pathname}`.trim();}
async function share(){const value=shareText();if(navigator.share){try{await navigator.share({text:value,title:t('intro')});return;}catch{}}await copyText(value);}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast(t('copied'));}catch{let input=document.createElement('textarea');input.value=s;document.body.appendChild(input);input.select();document.execCommand('copy');input.remove();toast(t('copied'));}}
function createClassCode(){const meta=getMeta(game?.lang||pref.lang);if(!LANGUAGE_META.some(x=>x.id===meta.id)){toast(t('disabled'));return;}const randomNum=(crypto?.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*1e8))%10000;let code=`${meta.code}-${game?.rank||pref.difficulty}-${String(randomNum).padStart(4,'0')}`;modal={type:'created',code};renderModal();}
function validClassCode(s){const match=s.trim().toUpperCase().match(/^([A-Z]{2})-([123])-(\d{4})$/);return match&&LANGUAGE_META.some(x=>x.code===match[1])?match[0]:null;}
function renderModal(){if(!modal){EL.modal.innerHTML='';return;}let content='',meta=getMeta();
 if(modal.type==='languages'){content=`<p class="eyebrow">LANGUAGE SELECT / 013</p><h2>${ESC(t('lang'))}</h2><div class="lang-list">${[...LANGUAGE_META,...pref.custom].map(l=>`<button class="lang-item ${l.id===pref.lang?'active':''}" data-action="set-lang" data-lang="${ESC(l.id)}"><span>${ESC(l.flag)}</span> ${ESC(l.name)} <span>${l.id===pref.lang?'✓':''}</span></button>`).join('')}</div><div class="modal-bottom"><label for="custom-lang">${ESC(t('customLang'))}</label><div class="row-input"><input id="custom-lang" maxlength="50" placeholder="Swahili" autocomplete="off"><button class="primary-mini" data-action="add-lang">＋ ${ESC(t('add'))}</button></div></div>`;}
 else if(modal.type==='join'){content=`<p class="eyebrow">CLASSROOM / JOIN</p><h2>${ESC(t('classroom'))}</h2><p class="modal-description">${ESC(t('classNote'))}</p><label for="class-code">${ESC(t('code'))}</label><input class="code-input" id="class-code" placeholder="KO-2-4821" maxlength="12" autocomplete="off" value="${ESC(modal.code||'')}"><p class="inline-error" id="class-error"></p><button class="primary-cta modal-wide" data-action="join-run">${ESC(t('join'))} ↗</button>`;}
 else if(modal.type==='created'){let link=location.protocol==='file:'?'':location.origin+location.pathname+'?class='+encodeURIComponent(modal.code);content=`<p class="eyebrow">CLASSROOM / SHARE</p><h2>${ESC(t('classGenerated'))}</h2><p class="modal-description">${ESC(t('classNote'))}</p><div class="generated-code">${ESC(modal.code)}</div><button class="primary-cta modal-wide" data-action="copy-class">${ESC(t('share'))} ↗</button>${link?`<p class="copy-link">${ESC(link)}</p>`:''}`;}
 else if(modal.type==='import'){
  const existing=listAll().slice(0,120).map(x=>x.c);
  content=`<p class="eyebrow">QUESTION LAB / JSON</p><h2>${ESC(t('import'))}</h2><p class="modal-description">${ESC(t('importHint'))}</p><div class="import-controls"><button class="outline-cta" data-action="copy-prompt">${ESC(t('getPrompt'))}</button><span>${ESC(getMeta().name)} · ${ESC(String((GEN[pref.lang]||[]).length))}/600</span></div><textarea id="import-json" rows="9" spellcheck="false" placeholder='[{"c":"correct","w":"wrnog","r":"Explanation","s":"This is correct.","d":2}]'></textarea><p class="inline-error" id="import-error"></p><button class="primary-cta modal-wide" data-action="import-run">${ESC(t('importRun'))} ↗</button><p class="micro-note">${ESC(t('notSupported'))}</p>`;
 }
 EL.modal.innerHTML=`<div class="modal-screen" role="presentation"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="${ESC(t('intro'))}"><button class="modal-close" data-action="close-modal" aria-label="${ESC(t('cancel'))}">✕</button>${content}</div></div>`;
}
function importQuestions(){let el=$('#import-json');if(!el)return;let raw;try{raw=JSON.parse(el.value);}catch{$('#import-error').textContent='Invalid JSON';return;}
 if(!Array.isArray(raw))raw=raw?.items||raw?.questions;
 if(!Array.isArray(raw)){$('#import-error').textContent='Expected JSON array';return;}
 const lang=pref.lang,bank=GEN[lang]||(GEN[lang]=[]);let seen=new Set([...listAll(lang)].map(x=>`${x.c.toLocaleLowerCase()}\u0000${x.w.toLocaleLowerCase()}`)),ok=0;
 for(let q of raw){if(!q||typeof q.c!=='string'||typeof q.w!=='string'||typeof q.r!=='string')continue;let c=q.c.trim(),w=q.w.trim(),r=q.r.trim();if(!c||!w||!r||[...c].length>48||[...w].length>48||c===w||!['1','2','3'].includes(String(q.d??2)))continue;
 let key=`${c.toLocaleLowerCase()}\u0000${w.toLocaleLowerCase()}`;if(seen.has(key)||bank.length>=600)continue;
 let s=typeof q.s==='string'&&includesOnce(q.s,c)?q.s.trim():'';let x=typeof q.x==='string'&&includesOnce(q.x,c)?q.x.trim():'';
 bank.push({id:`${lang}-g-${hash(key).toString(36)}`,lang,c,w,r,s,x,d:+(q.d??2),source:'generated'});seen.add(key);ok++;
 }
 save(KEY.gen,GEN);modal=null;render();toast(`${ok} ${pref.lang==='ko'?'문항 저장됨':'questions saved'}`);
}
function createPrompt(){const avoid=listAll().slice(0,120).map(x=>`${x.c} / ${x.w}`).join('\n');return `Create 12 high-quality spelling quiz pairs for language ${getMeta().name}. Explain each rule in ${getMeta().name}. Return ONLY a JSON array of objects with fields c (correct spelling), w (plausible commonly observed NON-standard misspelling), r (one-sentence explanation), s (one natural sentence containing c exactly once), x (optional natural chat/email/notice containing c exactly once), d (integer 1-3). Do not include any pair where w is valid in any context or both variants are accepted. No duplicates. Exclude these existing pairs:\n${avoid}`;}
function reportQuestion(){if(!overlay)return;let q=overlay.q;REPORTS[game.lang]=REPORTS[game.lang]||{};REPORTS[game.lang][q.id]=(REPORTS[game.lang][q.id]||0)+1;save(KEY.reports,REPORTS);toast(t('reportOk'));}
function addCustom(){let text=$('#custom-lang')?.value.trim();if(!text)return;let id='custom:'+text.toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').slice(0,40);if(!pref.custom.some(x=>x.id===id))pref.custom.push({id,name:text,code:'XX',locale:text.slice(0,2).toLowerCase(),flag:'🌐'});pref.lang=id;modal=null;render();}
function clickAction(action,dataset){if(action==='home'){clearTimers();try{speechSynthesis.cancel();}catch{}game=null;overlay=null;modal=null;view='home';render();return;}
 if(action==='theme'){pref.theme=pref.theme==='dark'?'light':pref.theme==='light'?'auto':'dark';render();return;}
 if(action==='difficulty'){pref.difficulty=+dataset.level;render();return;}
 if(action==='start'){startGame(dataset.mode);return;}
 if(action==='languages'){modal={type:'languages'};renderModal();return;}
 if(action==='close-modal'){modal=null;renderModal();return;}
 if(action==='set-lang'){pref.lang=dataset.lang;modal=null;render();return;}
 if(action==='add-lang'){addCustom();return;}
 if(action==='import'){modal={type:'import'};renderModal();return;}
 if(action==='copy-prompt'){copyText(createPrompt());return;}
 if(action==='import-run'){importQuestions();return;}
 if(action==='join'){modal={type:'join'};renderModal();return;}
 if(action==='join-run'){let code=validClassCode($('#class-code')?.value||'');if(!code){$('#class-error').textContent='Use format KO-2-4821 / EN-1-0000';return;}pref.lang=LANGUAGE_META.find(x=>x.code===code.slice(0,2)).id;pref.difficulty=+code[3];modal=null;startGame('class',{classCode:code});return;}
 if(action==='class-create'){createClassCode();return;}
 if(action==='copy-class'){let code=modal?.code||'',url=location.protocol==='file:'?code:location.origin+location.pathname+'?class='+encodeURIComponent(code);copyText(url);return;}
 if(action==='speak'){speak();return;}
 if(action==='next'){nextQuestion();return;}
 if(action==='report'){reportQuestion();return;}
 if(action==='replay'){let mode=game.mode,code=game.classCode;startGame(mode,{classCode:code});return;}
 if(action==='share'){share();return;}
}
document.addEventListener('click',e=>{const c=e.target.closest('[data-choice]');if(c){answer(c.dataset.choice);return;}const a=e.target.closest('[data-action]');if(a){clickAction(a.dataset.action,a.dataset);return;}if(e.target.classList.contains('modal-screen')){modal=null;renderModal();}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&modal){modal=null;renderModal();return;}
 if(modal){if(e.key==='Enter'&&modal.type==='join'){e.preventDefault();clickAction('join-run',{});}return;}
 if(view!=='play')return;
 if(overlay){if(e.key==='Enter'||e.key===' '){e.preventDefault();nextQuestion();}return;}
 let p=game?.activePattern;if(!p)return;
 if(['1','2','3'].includes(e.key)){e.preventDefault();let index=Number(e.key)-1;if(p.kind==='tokens')return; if(index<p.opts.length)answer(String(index));}
 if(e.key===' '&&p.pat==='mine'){e.preventDefault();answer(String(p.opts.indexOf('pass')));}
});
window.addEventListener('visibilitychange',()=>{if(document.hidden&&game?.mode==='speed'&&view==='play')tick();});
if('speechSynthesis' in window){const update=()=>{voiceList=speechSynthesis.getVoices()||[];if(view==='home')renderHome();};voiceList=speechSynthesis.getVoices()||[];speechSynthesis.addEventListener?.('voiceschanged',update);}
const maybeCode=new URLSearchParams(location.search).get('class');if(maybeCode&&validClassCode(maybeCode))modal={type:'join',code:maybeCode};
render();
// Intentionally expose only a small read-only testing surface; no external dependencies.
Object.defineProperty(window,'TypoDetective',{value:Object.freeze({version:'1.0.0',languages:LANGUAGE_META.map(x=>x.id),getQuestionCounts:()=>Object.fromEntries(Object.entries(BANKS).map(([key,v])=>[key,v.length])),getView:()=>view,getStats:()=>JSON.parse(JSON.stringify(ST)),getReview:()=>JSON.parse(JSON.stringify(SR))})});
})();
</script>
</body></html>
